[package]
name = "certum_attest"
version = "0.1.0"
description = "Institutional SAS wrapper and on-chain verification program for Certum"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "certum_attest"

[features]
default = []
cpi = ["no-entrypoint"]
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.3"
borsh = "1.5.5"
solana-attestation-service-client = "1.0.9"
